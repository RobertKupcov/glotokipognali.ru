<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ГЛОТОК — живая комбуча</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Базовые стили модального окна */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      overflow-y: auto;
      backdrop-filter: blur(4px);
    }

    /* Стили содержимого окна */
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s ease-out;
    }

    .modal-content.active {
      opacity: 1;
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 30px;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }

    .modal-close:hover {
      color: #333;
    }

    .modal input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    .modal input:focus {
      outline: none;
      border-color: #d4a373;
    }

    .modal .order-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: #d4a373;
      color: #fff;
      transition: background-color 0.2s;
    }

    .modal .order-btn:hover {
      background-color: #c29365;
    }

    /* Эффект на карточках вкусов */
    .flavor-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: #fff;
    }

    .flavor-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }
